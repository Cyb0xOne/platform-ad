# Dashboard custom — dijalankan di host, di network forcad_default agar bisa
# menyambung ke Postgres ForcAD (alias `postgres`) secara read-only.
#
# FORCAD_DSN diambil dari .env (TIDAK di-commit; berisi password DB ForcAD).
# Buat .env dari kredensial engine — lihat .env.example. Cara cepat di server:
#   set -a; . ~/adlab/forcad/docker_config/postgres_environment.env; set +a
#   echo "FORCAD_DSN=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB" > .env
# `/` tetap memakai UI legacy. Set DASHBOARD_DEFAULT_UI=react di .env untuk
# memindahkan `/` ke React; `/legacy/` tetap menjadi rollback path.

services:
  dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: adlab/dashboard:latest
    container_name: adlab-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8090:8000"
    networks: [forcad_default]

  dashboard-admin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: adlab/dashboard:latest
    container_name: adlab-dashboard-admin
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "admin_app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Listener hanya bisa dicapai dari host, misalnya melalui SSH tunnel.
      - "127.0.0.1:8091:8000"
    environment:
      CONTROL_KEY: /secrets/controlkey
      CONTROL_USER: reky
      CONTROL_HOST: host.docker.internal
      CONTROL_HISTORY_PATH: /data/control-history.jsonl
      VM_SSH_KEY: /secrets/vmkey
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets/vmkey:/secrets/vmkey:ro
      - ./secrets/controlkey:/secrets/controlkey:ro
      - ./admin-data:/data
    networks: [forcad_default]

networks:
  forcad_default:
    external: true
